spring.application.name=200ok

server.address=0.0.0.0
server.port=5000

# Database
# Uses RDS when DB_URL, DB_USERNAME, and DB_PASSWORD are configured.
# Falls back to an in-memory H2 database for local development and tests.
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s

# JWT (use environment variables outside local development)
jwt.token.secret-key=${JWT_SECRET_KEY:change-this-local-development-secret-key-32bytes}
jwt.token.expiration.access=${JWT_ACCESS_EXPIRATION:1800000}
jwt.token.expiration.refresh=${JWT_REFRESH_EXPIRATION:1209600000}

# Kakao OAuth2
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_REST_API_KEY:local-kakao-client-id}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_REST_API_SECRET:local-kakao-client-secret}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri=${KAKAO_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# Frontend / authentication cookies
app.frontend-url=${FRONTEND_URL:https://ssok.store}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AI server base URL. Override AI_SERVER_URL in each deployment environment.
ai.server.url=${AI_SERVER_URL:https://two00ok-ai.onrender.com}

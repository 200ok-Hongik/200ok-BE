version: '3.8'

services:
  # MySQL: 핵심 마스터 데이터 관리
  mysql:
    image: mysql:8.0
    container_name: 200ok-ssok
    ports:
      - "3309:3306" # 로컬 PC에서는 3309 포트로 접속
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: app_db
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql  # 컨테이너 삭제돼도 데이터 유지
    restart: unless-stopped

  # Redis: AI 분석 작업 상태 및 임시 데이터 관리
  redis:
    image: redis:7-alpine
    container_name: 200ok-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: 200ok-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

# 데이터 영구 저장을 위한 볼륨 선언
volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:

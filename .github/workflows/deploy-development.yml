name: 200ok-BE EC2 CI/CD

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: develop-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          image="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --tag "$image" --tag "$REGISTRY/$ECR_REPOSITORY:develop" .
          docker push "$image"
          docker push "$REGISTRY/$ECR_REPOSITORY:develop"
          echo "APP_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Deploy on EC2 with Systems Manager
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          compose_b64=$(base64 -w0 infra/ec2/compose.yml)
          caddy_b64=$(base64 -w0 infra/ec2/Caddyfile)
          deploy_b64=$(base64 -w0 infra/ec2/deploy.sh)
          backup_b64=$(base64 -w0 infra/ec2/backup.sh)
          parameters=$(jq -n \
            --arg compose "$compose_b64" \
            --arg caddy "$caddy_b64" \
            --arg deploy "$deploy_b64" \
            --arg backup "$backup_b64" \
            --arg registry "$ECR_REGISTRY" \
            --arg region "$AWS_REGION" \
            --arg image "$APP_IMAGE" \
            '{commands: [
              "install -d -o ubuntu -g ubuntu /opt/ssok/infra/ec2",
              ("echo " + $compose + " | base64 -d > /opt/ssok/infra/ec2/compose.yml"),
              ("echo " + $caddy + " | base64 -d > /opt/ssok/infra/ec2/Caddyfile"),
              ("echo " + $deploy + " | base64 -d > /opt/ssok/infra/ec2/deploy.sh"),
              ("echo " + $backup + " | base64 -d > /opt/ssok/infra/ec2/backup.sh"),
              "chown ubuntu:ubuntu /opt/ssok/infra/ec2/compose.yml /opt/ssok/infra/ec2/Caddyfile /opt/ssok/infra/ec2/deploy.sh /opt/ssok/infra/ec2/backup.sh",
              "chmod 755 /opt/ssok/infra/ec2/deploy.sh /opt/ssok/infra/ec2/backup.sh",
              ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry),
              ("cd /opt/ssok/infra/ec2 && ./deploy.sh " + $image)
            ]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $GITHUB_SHA" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)
          set +e
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID"
          set -e
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID"
          test "$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query Status --output text)" = Success
